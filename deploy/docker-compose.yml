# JenderalRouter — Docker Compose untuk VPS (PRD §10.1).
# Caddy menangani HTTPS otomatis (Let's Encrypt); port publik hanya 80/443.
# Port aplikasi 20130 hanya di-publish ke loopback host (health check & tunnel).
#
# Pakai (jalankan dari folder deploy/ hasil clone):
#   1. cp .env.example .env lalu isi JR_DOMAIN (dan JR_PUBLIC_URL bila ada domain)
#   2. docker compose up -d --build

services:
  jenderalrouter:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${VERSION:-1.0.0}
    image: jenderalrouter:latest
    container_name: jenderalrouter
    restart: unless-stopped
    environment:
      JR_ADDR: "0.0.0.0:20130"
      # Kosong bila tanpa domain (akses via SSH tunnel http://localhost:20130);
      # cookie Secure otomatis hanya aktif bila JR_PUBLIC_URL https.
      JR_PUBLIC_URL: "${JR_PUBLIC_URL:-}"
      JR_DATA_DIR: "/data"
      JR_TZ: "${JR_TZ:-Asia/Jakarta}"
      JR_LOG_PROMPTS: "${JR_LOG_PROMPTS:-false}"
      # LlamaStash di host (bukan container) — akses via gateway docker:
      JR_LLAMASTASH_URL: "${JR_LLAMASTASH_URL:-http://host.docker.internal:11435/v1}"
      # Backend tool web_search chat (pilih salah satu; kosong semua = halaman
      # Brave Search tanpa key, ~5 permintaan/menit). Contoh SearXNG di bawah:
      # JR_SEARXNG_URL=http://searxng:8080
      JR_SEARXNG_URL: "${JR_SEARXNG_URL:-}"
      JR_BRAVE_API_KEY: "${JR_BRAVE_API_KEY:-}"
      JR_TAVILY_API_KEY: "${JR_TAVILY_API_KEY:-}"
    # host.docker.internal → IP host (untuk LlamaStash di host)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - jr-data:/data
    # Port app hanya di-publish ke loopback host — publik tetap lewat Caddy.
    # Ini membuat `curl http://127.0.0.1:20130/healthz` berfungsi di host.
    ports:
      - "127.0.0.1:20130:20130"
    healthcheck:
      test: ["CMD", "/jenderalrouter", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: jenderalrouter-caddy
    restart: unless-stopped
    depends_on:
      - jenderalrouter
    ports:
      - "80:80"
      - "443:443"
    environment:
      JR_DOMAIN: "${JR_DOMAIN:?isi JR_DOMAIN di .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # OPSIONAL — SearXNG (mesin pencari self-host untuk tool web_search).
  # Aktifkan, set JR_SEARXNG_URL=http://searxng:8080 di .env, lalu di
  # ./searxng/settings.yml pastikan format JSON aktif:
  #   use_default_settings: true
  #   server: { secret_key: "<acak>", limiter: false }
  #   search: { formats: [html, json] }
  # searxng:
  #   image: searxng/searxng:latest
  #   restart: unless-stopped
  #   volumes:
  #     - ./searxng:/etc/searxng

  # OPSIONAL — PostgreSQL (default deployment memakai SQLite di volume).
  # Aktifkan lalu set JR_DATABASE_URL di service jenderalrouter.
  # postgres:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: jenderalrouter
  #     POSTGRES_USER: jr
  #     POSTGRES_PASSWORD: "${JR_PG_PASSWORD:?isi JR_PG_PASSWORD}"
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data

volumes:
  jr-data:
  caddy-data:
  caddy-config:
